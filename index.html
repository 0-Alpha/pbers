<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBers — ポーランドボール チャンネル分析</title>
<meta name="description" content="日本のポーランドボール系YouTubeチャンネルの登録者数まとめ・分析。円グラフ・棒グラフで可視化。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>PB<b>ers</b></span></div>
    <nav>
      <a href="#share">シェア</a>
      <a href="#ranking">ランキング</a>
      <a href="#channels">チャンネル</a>
    </nav>
  </div>
</header>

<main>
  <!-- HERO : total + giant donut -->
  <section class="hero">
    <div class="wrap">
      <span class="kicker">Polandball Analytics</span>

      <div class="toggle" id="toggle" role="tablist">
        <button class="tg on" data-metric="subs">登録者数</button>
        <button class="tg" data-metric="views">総再生数</button>
        <span class="tg-ind" id="tg-ind"></span>
      </div>

      <div class="total-cap" id="total-cap">合計登録者数 / Total Subscribers</div>
      <div class="total num" id="total">—</div>
      <div class="total-sub"><span class="num" id="total-man"></span> ・ <span class="num" id="ch-count"></span> channels</div>

      <div class="donut-stage" id="share">
        <svg id="donut-svg" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <div class="donut-center" id="dc">
          <div class="dc-name" id="dc-name"></div>
          <div class="dc-num num" id="dc-num">—</div>
          <div class="dc-cap" id="dc-cap">Subscribers</div>
          <div class="dc-pct num" id="dc-pct"></div>
        </div>
      </div>

      <div class="legend" id="legend"></div>
    </div>
  </section>

  <!-- RANKING bar chart -->
  <section class="block" id="ranking">
    <div class="wrap">
      <div class="sec-head">
        <h2>登録者ランキング <span class="en">Ranking</span></h2>
        <span class="note">更新 <span id="updated"></span></span>
      </div>
      <div class="col-hint">↔ ドラッグ / ホイールで横スクロール</div>
      <div class="col-scroll" id="col-scroll"><div class="col-chart" id="cols"></div></div>
    </div>
  </section>

  <!-- DIRECTORY -->
  <section class="block" id="channels">
    <div class="wrap">
      <div class="sec-head">
        <h2>チャンネル一覧 <span class="en">Directory</span></h2>
        <span class="note">クリックでYouTubeへ</span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- NEWS -->
  <section class="block" id="news">
    <div class="wrap">
      <div class="sec-head">
        <h2>ニュース <span class="en">News</span></h2>
        <span class="note">直近7日間のマイルストーン突破</span>
      </div>
      <div class="news" id="news-list"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>PB<b>ers</b></span></div>
    <div>データ出典: YouTube 各チャンネル公開情報 / 更新 <span id="updated-foot"></span></div>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/news.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
