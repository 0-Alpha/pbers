<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="ball"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <!-- Polandball: white top, red bottom -->
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="64" height="32" fill="#f4f1ef"/>
    <rect x="0" y="32" width="64" height="32" fill="#d81e1e"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#151515" stroke-width="3"/>
  <!-- eyes -->
  <ellipse cx="23.5" cy="23" rx="4.6" ry="5.6" fill="#ffffff" stroke="#151515" stroke-width="1.6"/>
  <ellipse cx="40.5" cy="23" rx="4.6" ry="5.6" fill="#ffffff" stroke="#151515" stroke-width="1.6"/>
  <circle cx="23.5" cy="24.2" r="1.9" fill="#111111"/>
  <circle cx="40.5" cy="24.2" r="1.9" fill="#111111"/>
</svg>
