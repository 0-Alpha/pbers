name: Daily stats

on:
  schedule:
    # 15:00 UTC = 00:00 JST（毎日）。GitHub側の混雑で数十分ずれる場合があります。
    - cron: '0 15 * * *'
  workflow_dispatch:        # 手動実行も可

permissions:
  contents: write

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats, append history, rebuild data.js
        run: |
          python fetch.py
          python record.py
          python gen_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily stats: $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            git push
          fi

      # --- X (Twitter) auto-post: best effort, never fails the job ---
      - name: Install X deps
        run: pip install requests requests-oauthlib

      - name: Post today's news to X
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python post_x.py
